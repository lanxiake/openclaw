# OpenClaw 生产环境 Docker Compose 配置
#
# 包含所有应用服务（API Server, Gateway）
#
# 使用方式:
#   docker-compose -f docker-compose.prod.yml up -d          # 启动所有服务
#   docker-compose -f docker-compose.prod.yml down           # 停止所有服务
#   docker-compose -f docker-compose.prod.yml logs -f        # 查看日志
#   docker-compose -f docker-compose.prod.yml restart        # 重启服务
#
# 前置条件:
#   1. 已启动基础设施服务 (docker-compose -f docker-compose.infra.yml up -d)
#   2. 已配置 .env.production 环境变量文件
#   3. 已运行数据库迁移 (pnpm db:migrate)
#
# 前端应用部署说明:
#   - Website: 静态文件部署到 Nginx（/var/www/openclaw-website）
#   - Admin Console: 构建后部署到 Nginx（/var/www/openclaw-admin）
#   - 详见: 生产环境部署文档.md
#

services:
  # ==================== API Server ====================
  api-server:
    build:
      context: .
      dockerfile: apps/api-server/Dockerfile
    image: openclaw-api-server:latest
    container_name: openclaw-api-server
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      # 数据库连接（使用 Docker 网络内部地址）
      DATABASE_URL: postgresql://${POSTGRES_USER:-openclaw_admin}:${POSTGRES_PASSWORD:-Oc@2026!Pg#Secure}@postgres:5432/${POSTGRES_DB:-openclaw_prod}
      # Redis 连接
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-Oc@2026!Rd#Secure}
      # MinIO 连接
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-openclaw_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-Oc@2026!Mn#Secure}
    ports:
      - "${API_SERVER_PORT:-22300}:3000"
    # 注意: depends_on 不能跨 compose 文件引用，基础设施服务在 infra.yml 中管理
    # 请确保基础设施服务已启动: docker compose -f docker-compose.infra.yml up -d
    networks:
      - openclaw-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./logs/api-server:/app/logs
      # 临时文件和编译缓存持久化到宿主机
      - ./data/api-server/tmp:/tmp/openclaw
      - ./data/api-server/tsx-cache:/tmp/tsx-1001
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ==================== Admin Console (可选，使用 Nginx 容器) ====================
  # 注意: 推荐使用主机 Nginx 部署前端应用，此服务仅作为备选方案
  # 使用前需要先构建: cd apps/admin-console && pnpm build
  admin-console:
    image: nginx:alpine
    container_name: openclaw-admin-console
    restart: unless-stopped
    ports:
      - "${ADMIN_CONSOLE_PORT:-22176}:80"
    volumes:
      - ./apps/admin-console/dist:/usr/share/nginx/html:ro
      - ./nginx/admin-console.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - openclaw-network
    profiles:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== Website (可选，使用 Nginx 容器) ====================
  # 注意: 推荐使用主机 Nginx 部署前端应用，此服务仅作为备选方案
  website:
    image: nginx:alpine
    container_name: openclaw-website
    restart: unless-stopped
    ports:
      - "${WEBSITE_PORT:-22888}:80"
    volumes:
      - ./apps/website:/usr/share/nginx/html:ro
      - ./nginx/website.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - openclaw-network
    profiles:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== Gateway ====================
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: openclaw-gateway:latest
    container_name: openclaw-gateway
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      HOME: /home/node
      TERM: xterm-256color
      # 数据库连接
      DATABASE_URL: postgresql://${POSTGRES_USER:-openclaw_admin}:${POSTGRES_PASSWORD:-Oc@2026!Pg#Secure}@postgres:5432/${POSTGRES_DB:-openclaw_prod}
      # Redis 连接
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-Oc@2026!Rd#Secure}
      # Gateway 配置
      OPENCLAW_GATEWAY_TOKEN: ${GATEWAY_TOKEN}
      OPENCLAW_SKIP_CHANNELS: 1
      CLAWDBOT_SKIP_CHANNELS: 1
    ports:
      - "${GATEWAY_PORT:-22189}:18789"
      - "${BRIDGE_PORT:-22190}:18790"
    # 注意: depends_on 不能跨 compose 文件引用，基础设施服务在 infra.yml 中管理
    networks:
      - openclaw-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./logs/gateway:/home/node/.openclaw/logs
      # 工作空间映射到宿主机（agent 会话文件、配置等）
      - ./data/gateway/workspace:/home/node/.openclaw/workspace
      # 临时文件和编译缓存持久化到宿主机
      - ./data/gateway/tmp:/tmp/openclaw
      - ./data/gateway/lock:/tmp/openclaw-1000
      - ./data/gateway/jiti-cache:/tmp/jiti
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${GATEWAY_BIND:-lan}",
        "--port",
        "18789",
        "--allow-unconfigured",
      ]

# ==================== 网络配置 ====================
networks:
  openclaw-network:
    external: true
    name: openclaw-network

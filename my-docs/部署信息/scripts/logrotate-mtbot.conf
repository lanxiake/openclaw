# MtBot 日志轮转配置
#
# 安装方式:
#   sudo cp logrotate-mtbot.conf /etc/logrotate.d/mtbot
#
# 手动测试:
#   sudo logrotate -d /etc/logrotate.d/mtbot    # 模拟运行
#   sudo logrotate -f /etc/logrotate.d/mtbot    # 强制执行

# Gateway 日志
/opt/mtbot/logs/gateway/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    maxsize 50M
}

# API Server 日志
/opt/mtbot/logs/api-server/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    maxsize 50M
}

# Nginx MtBot 日志
/var/log/nginx/mtbot-*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 0640 nginx nginx
    sharedscripts
    postrotate
        [ -f /var/run/nginx.pid ] && kill -USR1 $(cat /var/run/nginx.pid)
    endscript
}

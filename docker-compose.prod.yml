# MtBot 生产环境 Docker Compose 配置
#
# 包含所有应用服务（API Server, Gateway）
#
# 使用方式:
#   docker-compose -f docker-compose.prod.yml up -d          # 启动所有服务
#   docker-compose -f docker-compose.prod.yml down           # 停止所有服务
#   docker-compose -f docker-compose.prod.yml logs -f        # 查看日志
#   docker-compose -f docker-compose.prod.yml restart        # 重启服务
#
# 前置条件:
#   1. 已启动基础设施服务 (docker-compose -f docker-compose.infra.yml up -d)
#   2. 已配置 .env.production 环境变量文件
#   3. 已运行数据库迁移 (pnpm db:migrate)
#

version: "3.8"

services:
  # ==================== API Server ====================
  api-server:
    build:
      context: .
      dockerfile: apps/api-server/Dockerfile
    image: mtbot-api-server:latest
    container_name: mtbot-api-server
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      # 数据库连接（使用 Docker 网络内部地址）
      DATABASE_URL: postgresql://${POSTGRES_USER:-mtbot_admin}:${POSTGRES_PASSWORD:-Oc@2026!Pg#Secure}@postgres:5432/${POSTGRES_DB:-mtbot_prod}
      # Redis 连接
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-Oc@2026!Rd#Secure}
      # MinIO 连接
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-mtbot_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-Oc@2026!Mn#Secure}
    ports:
      - "${API_SERVER_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - mtbot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./logs/api-server:/app/logs
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ==================== Gateway ====================
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: mtbot-gateway:latest
    container_name: mtbot-gateway
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      HOME: /home/node
      TERM: xterm-256color
      # 数据库连接
      DATABASE_URL: postgresql://${POSTGRES_USER:-mtbot_admin}:${POSTGRES_PASSWORD:-Oc@2026!Pg#Secure}@postgres:5432/${POSTGRES_DB:-mtbot_prod}
      # Redis 连接
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-Oc@2026!Rd#Secure}
      # Gateway 配置
      MTBOT_GATEWAY_TOKEN: ${GATEWAY_TOKEN}
      MTBOT_SKIP_CHANNELS: 1
      CLAWDBOT_SKIP_CHANNELS: 1
    ports:
      - "${GATEWAY_PORT:-18789}:18789"
      - "${BRIDGE_PORT:-18790}:18790"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mtbot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./logs/gateway:/home/node/.mtbot/logs
      - gateway-workspace:/home/node/.mtbot/workspace
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${GATEWAY_BIND:-lan}",
        "--port",
        "${GATEWAY_PORT:-18789}",
      ]

# ==================== 网络配置 ====================
networks:
  mtbot-network:
    external: true
    name: mtbot-network

# ==================== 数据卷 ====================
volumes:
  gateway-workspace:
    name: mtbot-gateway-workspace

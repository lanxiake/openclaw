services:
  - type: web
    name: mtbot
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: SETUP_PASSWORD
        sync: false
      - key: MTBOT_STATE_DIR
        value: /data/.mtbot
      - key: MTBOT_WORKSPACE_DIR
        value: /data/workspace
      - key: MTBOT_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: mtbot-data
      mountPath: /data
      sizeGB: 1

services:
  mtbot-gateway:
    image: ${MTBOT_IMAGE:-mtbot:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      MTBOT_GATEWAY_TOKEN: ${MTBOT_GATEWAY_TOKEN}
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
    volumes:
      - ${MTBOT_CONFIG_DIR}:/home/node/.mtbot
      - ${MTBOT_WORKSPACE_DIR}:/home/node/.mtbot/workspace
    ports:
      - "${MTBOT_GATEWAY_PORT:-18789}:18789"
      - "${MTBOT_BRIDGE_PORT:-18790}:18790"
    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${MTBOT_GATEWAY_BIND:-lan}",
        "--port",
        "${MTBOT_GATEWAY_PORT:-18789}",
      ]

  mtbot-cli:
    image: ${MTBOT_IMAGE:-mtbot:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      BROWSER: echo
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
    volumes:
      - ${MTBOT_CONFIG_DIR}:/home/node/.mtbot
      - ${MTBOT_WORKSPACE_DIR}:/home/node/.mtbot/workspace
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
